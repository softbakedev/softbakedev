name: Deploy Azure Container App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-container-app
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web app
        uses: actions/checkout@v4

      - name: Checkout recipes
        uses: actions/checkout@v4
        with:
          repository: softbakedev/recipes
          ref: main
          path: recipes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure ACR exists and prepare image tags
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          ACR_NAME: ${{ vars.ACR_NAME || 'softbakedevacr01' }}
        run: |
          set -euo pipefail

          if [ -z "$AZURE_RESOURCE_GROUP" ] || [ -z "$AZURE_LOCATION" ] || [ -z "$ACR_NAME" ]; then
            echo "AZURE_RESOURCE_GROUP, AZURE_LOCATION, and ACR_NAME variables are required."
            exit 1
          fi

          if ! az acr show --resource-group "$AZURE_RESOURCE_GROUP" --name "$ACR_NAME" >/dev/null 2>&1; then
            az acr create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$ACR_NAME" \
              --location "$AZURE_LOCATION" \
              --sku Basic
          fi

          acr_login_server="$(az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)"

          echo "IMAGE=${acr_login_server}/softbakedev:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${acr_login_server}/softbakedev:latest" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=${acr_login_server}" >> "$GITHUB_ENV"

          az acr login --name "$ACR_NAME"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-contexts: |
            recipes=./recipes
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_LATEST }}

      - name: Upsert Container Apps infrastructure and deploy
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          ACR_NAME: ${{ vars.ACR_NAME || 'softbakedevacr01' }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'softbake.dev' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAGE: ${{ env.IMAGE }}
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            run_with_containerapp_retry() {
              local attempt status output sleep_seconds
              for attempt in 1 2 3 4 5 6 7 8; do
                set +e
                output="$("$@" 2>&1)"
                status=$?
                set -e

                if [ "$status" -eq 0 ]; then
                  if [ -n "$output" ]; then
                    printf '%s\n' "$output"
                  fi
                  return 0
                fi

                if printf '%s' "$output" | grep -q "ContainerAppOperationInProgress"; then
                  if [ "$attempt" -lt 8 ]; then
                    sleep_seconds="$((attempt * 15))"
                    echo "Container App operation in progress; retry ${attempt}/8 in ${sleep_seconds}s..."
                    sleep "$sleep_seconds"
                    continue
                  fi
                fi

                printf '%s\n' "$output"
                return "$status"
              done

              printf '%s\n' "$output"
              return 1
            }

            if [ -z "$AZURE_RESOURCE_GROUP" ] || [ -z "$AZURE_LOCATION" ]; then
              echo "AZURE_RESOURCE_GROUP and AZURE_LOCATION variables are required."
              exit 1
            fi

            if [ -z "$ACR_NAME" ]; then
              echo "ACR_NAME variable is required."
              exit 1
            fi

            az extension add --name containerapp --upgrade

            if ! az acr show --resource-group "$AZURE_RESOURCE_GROUP" --name "$ACR_NAME" >/dev/null 2>&1; then
              az acr create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$ACR_NAME" \
                --location "$AZURE_LOCATION" \
                --sku Basic
            fi

            acr_id="$(az acr show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$ACR_NAME" \
              --query id \
              --output tsv)"

            acr_login_server="$(az acr show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$ACR_NAME" \
              --query loginServer \
              --output tsv)"

            app_name="softbakedev"
            env_name="softbakedev-env"
            workspace_name="softbakedev-law"

            workspace_id="$(az monitor log-analytics workspace show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --workspace-name "$workspace_name" \
              --query customerId \
              --output tsv 2>/dev/null || true)"

            if [ -z "$workspace_id" ]; then
              workspace_id="$(az monitor log-analytics workspace create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --workspace-name "$workspace_name" \
                --location "$AZURE_LOCATION" \
                --query customerId \
                --output tsv)"
            fi

            workspace_key="$(az monitor log-analytics workspace get-shared-keys \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --workspace-name "$workspace_name" \
              --query primarySharedKey \
              --output tsv)"

            if ! az containerapp env show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$env_name" >/dev/null 2>&1; then
              az containerapp env create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$env_name" \
                --location "$AZURE_LOCATION" \
                --logs-workspace-id "$workspace_id" \
                --logs-workspace-key "$workspace_key"
            fi

            if ! az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" >/dev/null 2>&1; then
              az containerapp create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --environment "$env_name" \
                --image "$IMAGE" \
                --ingress external \
                --target-port 8080 \
                --system-assigned \
                --registry-server "$acr_login_server" \
                --registry-identity system \
                --secrets "smtp-user=$SMTP_USER" "smtp-pass=$SMTP_PASS" \
                --env-vars \
                  PORT=8080 \
                  SMTP_HOST="$SMTP_HOST" \
                  SMTP_PORT="$SMTP_PORT" \
                  SMTP_USER=secretref:smtp-user \
                  SMTP_PASS=secretref:smtp-pass \
                  MAIL_FROM="$MAIL_FROM" \
                  MAIL_TO="$MAIL_TO"
            fi

            principal_id=""
            for attempt in 1 2 3 4 5 6; do
              principal_id="$(az containerapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --query identity.principalId \
                --output tsv)"

              if [ -n "$principal_id" ] && [ "$principal_id" != "null" ]; then
                break
              fi

              if [ "$attempt" -lt 6 ]; then
                sleep_seconds="$((attempt * 5))"
                echo "Waiting for Container App principal id (${attempt}/6), sleeping ${sleep_seconds}s..."
                sleep "$sleep_seconds"
              fi
            done

            if [ -z "$principal_id" ] || [ "$principal_id" = "null" ]; then
              run_with_containerapp_retry az containerapp identity assign \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --system-assigned \
                --output none

              for attempt in 1 2 3 4 5 6; do
                principal_id="$(az containerapp show \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$app_name" \
                  --query identity.principalId \
                  --output tsv)"

                if [ -n "$principal_id" ] && [ "$principal_id" != "null" ]; then
                  break
                fi

                if [ "$attempt" -lt 6 ]; then
                  sleep_seconds="$((attempt * 5))"
                  echo "Waiting for Container App principal id after identity assignment (${attempt}/6), sleeping ${sleep_seconds}s..."
                  sleep "$sleep_seconds"
                fi
              done

              if [ -z "$principal_id" ] || [ "$principal_id" = "null" ]; then
                echo "Unable to resolve Container App system-assigned identity principal id."
                exit 1
              fi
            fi

            if [ -n "$principal_id" ]; then
              existing_assignment_count="$(az role assignment list \
                --assignee-object-id "$principal_id" \
                --scope "$acr_id" \
                --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
                --output tsv)"

              if [ "$existing_assignment_count" = "0" ]; then
                echo "Assigning AcrPull to Container App identity on ACR scope..."
                assignment_succeeded="false"
                for attempt in 1 2 3 4 5 6; do
                  if az role assignment create \
                    --assignee-object-id "$principal_id" \
                    --assignee-principal-type ServicePrincipal \
                    --role AcrPull \
                    --scope "$acr_id" \
                    --output none 2>/dev/null; then
                    assignment_succeeded="true"
                    break
                  fi

                  if [ "$attempt" -lt 6 ]; then
                    sleep_seconds="$((attempt * 10))"
                    echo "AcrPull assignment attempt ${attempt} failed, retrying in ${sleep_seconds}s..."
                    sleep "$sleep_seconds"
                  fi
                done

                if [ "$assignment_succeeded" != "true" ]; then
                  echo "Failed to create AcrPull role assignment after retries."
                  exit 1
                fi
              fi

              if [ "$existing_assignment_count" = "0" ]; then
                for attempt in 1 2 3 4 5 6; do
                  effective_assignment_count="$(az role assignment list \
                    --assignee-object-id "$principal_id" \
                    --scope "$acr_id" \
                    --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
                    --output tsv)"

                  if [ "$effective_assignment_count" != "0" ]; then
                    break
                  fi

                  if [ "$attempt" -lt 6 ]; then
                    sleep_seconds="$((attempt * 10))"
                    echo "Waiting for AcrPull role assignment propagation (${attempt}/6), sleeping ${sleep_seconds}s..."
                    sleep "$sleep_seconds"
                  else
                    echo "AcrPull role assignment did not propagate in time."
                    exit 1
                  fi
                done
              fi
            fi

            run_with_containerapp_retry az containerapp registry set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --server "$acr_login_server" \
              --identity system

            ghcr_registry_count="$(az containerapp registry list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query "[?server=='ghcr.io'] | length(@)" \
              --output tsv)"

            if [ "$ghcr_registry_count" != "0" ]; then
              az containerapp registry remove \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --server ghcr.io || true
            fi

            ghcr_secret_count="$(az containerapp secret list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query "[?name=='ghcrio-jvaca92code'] | length(@)" \
              --output tsv)"

            if [ "$ghcr_secret_count" = "1" ]; then
              az containerapp secret remove \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --secret-names ghcrio-jvaca92code || true
            fi

            run_with_containerapp_retry az containerapp secret set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --secrets "smtp-user=$SMTP_USER" "smtp-pass=$SMTP_PASS"

            run_with_containerapp_retry az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --image "$IMAGE" \
              --set-env-vars \
                PORT=8080 \
                SMTP_HOST="$SMTP_HOST" \
                SMTP_PORT="$SMTP_PORT" \
                SMTP_USER=secretref:smtp-user \
                SMTP_PASS=secretref:smtp-pass \
                MAIL_FROM="$MAIL_FROM" \
                MAIL_TO="$MAIL_TO"

            default_fqdn="$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query "properties.configuration.ingress.fqdn" \
              --output tsv)"

            echo "Default Container Apps URL: https://${default_fqdn}"

            if [ -n "${CUSTOM_DOMAIN:-}" ]; then
              verification_id="$(az containerapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --query "properties.customDomainVerificationId" \
                --output tsv)"
              static_ip="$(az containerapp env show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$env_name" \
                --query "properties.staticIp" \
                --output tsv)"

              echo "Custom domain requested: ${CUSTOM_DOMAIN}"
              echo "For apex domain ${CUSTOM_DOMAIN}, configure DNS:"
              echo "  A     @                    ${static_ip}"
              echo "  TXT   asuid                ${verification_id}"
              echo "If using www.${CUSTOM_DOMAIN}, configure DNS:"
              echo "  CNAME www                  ${default_fqdn}"
              echo "  TXT   asuid.www            ${verification_id}"

              if az containerapp hostname bind \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --hostname "$CUSTOM_DOMAIN" \
                --environment "$env_name" \
                --validation-method TXT \
                --output none; then
                echo "Custom domain bound: https://${CUSTOM_DOMAIN}"
              else
                echo "Custom domain binding is not complete yet. Add/propagate the DNS records above, then rerun this workflow."
              fi
            fi

      - name: Configure Azure alerts
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          ALERT_EMAIL: jan.vaca@softbake.dev
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            if [ -z "$AZURE_RESOURCE_GROUP" ] || [ -z "$AZURE_LOCATION" ] || [ -z "$ALERT_EMAIL" ]; then
              echo "AZURE_RESOURCE_GROUP, AZURE_LOCATION, and ALERT_EMAIL are required."
              exit 1
            fi

            az config set extension.use_dynamic_install=yes_without_prompt
            az config set extension.dynamic_install_allow_preview=true

            app_name="softbakedev"
            workspace_name="softbakedev-law"
            action_group_name="ag-softbakedev-prod"
            action_group_short="softbakeops"
            startup_alert_name="alert-softbakedev-startup-failures"
            ingress_alert_name="alert-softbakedev-ingress-5xx"
            activity_alert_name="alert-softbakedev-deploy-failures"

            subscription_id="$(az account show --query id --output tsv)"
            subscription_scope="/subscriptions/${subscription_id}"

            app_resource_id="$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query id \
              --output tsv)"

            workspace_resource_id="$(az monitor log-analytics workspace show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --workspace-name "$workspace_name" \
              --query id \
              --output tsv)"

            if ! az monitor action-group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$action_group_name" >/dev/null 2>&1; then
              az monitor action-group create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$action_group_name" \
                --short-name "$action_group_short" \
                --action email primary "$ALERT_EMAIL" usecommonalertschema \
                --output none
            fi

            has_alert_email="$(az monitor action-group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$action_group_name" \
              --query "contains(join(',', emailReceivers[].emailAddress), '${ALERT_EMAIL}')" \
              --output tsv)"

            if [ "$has_alert_email" != "true" ]; then
              az monitor action-group update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$action_group_name" \
                --add-action email primary "$ALERT_EMAIL" usecommonalertschema \
                --output none
            fi

            action_group_id="$(az monitor action-group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$action_group_name" \
              --query id \
              --output tsv)"

            startup_query="ContainerAppSystemLogs_CL | where TimeGenerated > ago(5m) | where tostring(ContainerAppName_s) == '${app_name}' | where tostring(Log_s) has_any ('ImagePullFailure','ErrImagePull','ImagePullBackOff','CrashLoopBackOff','Back-off restarting failed container','revision failed','Failed to pull image') or tostring(Reason_s) has_any ('ImagePullFailure','CrashLoopBackOff','ContainerCreateFailure')"

            if az monitor scheduled-query show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$startup_alert_name" >/dev/null 2>&1; then
              az monitor scheduled-query update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$startup_alert_name" \
                --condition "count 'StartupFailures' > 0" \
                --condition-query StartupFailures="$startup_query" \
                --severity 1 \
                --window-size 5m \
                --evaluation-frequency 5m \
                --auto-mitigate false \
                --mute-actions-duration PT15M \
                --action-groups "$action_group_id" \
                --description "Container App startup/image pull failures detected for softbakedev." \
                --skip-query-validation true \
                --output none
            else
              az monitor scheduled-query create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --location "$AZURE_LOCATION" \
                --name "$startup_alert_name" \
                --scopes "$workspace_resource_id" \
                --condition "count 'StartupFailures' > 0" \
                --condition-query StartupFailures="$startup_query" \
                --severity 1 \
                --window-size 5m \
                --evaluation-frequency 5m \
                --auto-mitigate false \
                --mute-actions-duration PT15M \
                --action-groups "$action_group_id" \
                --description "Container App startup/image pull failures detected for softbakedev." \
                --skip-query-validation true \
                --output none
            fi

            ingress_query="AzureDiagnostics | where TimeGenerated > ago(5m) | where ResourceProvider == 'MICROSOFT.APP' | where Resource == '${app_name}' | where Category has 'Ingress' | extend statusCode = toint(coalesce(tostring(StatusCode), tostring(statusCode_s), tostring(ResponseCode_d), tostring(HttpStatusCode_d))) | where statusCode >= 500"

            if az monitor scheduled-query show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$ingress_alert_name" >/dev/null 2>&1; then
              az monitor scheduled-query update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$ingress_alert_name" \
                --condition "count 'Ingress5xx' > 5" \
                --condition-query Ingress5xx="$ingress_query" \
                --severity 1 \
                --window-size 5m \
                --evaluation-frequency 5m \
                --auto-mitigate false \
                --mute-actions-duration PT15M \
                --action-groups "$action_group_id" \
                --description "Container App ingress 5xx spike detected for softbakedev." \
                --skip-query-validation true \
                --output none
            else
              az monitor scheduled-query create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --location "$AZURE_LOCATION" \
                --name "$ingress_alert_name" \
                --scopes "$workspace_resource_id" \
                --condition "count 'Ingress5xx' > 5" \
                --condition-query Ingress5xx="$ingress_query" \
                --severity 1 \
                --window-size 5m \
                --evaluation-frequency 5m \
                --auto-mitigate false \
                --mute-actions-duration PT15M \
                --action-groups "$action_group_id" \
                --description "Container App ingress 5xx spike detected for softbakedev." \
                --skip-query-validation true \
                --output none
            fi

            if az monitor activity-log alert show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$activity_alert_name" >/dev/null 2>&1; then
              az monitor activity-log alert update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$activity_alert_name" \
                --condition "resourceType=MICROSOFT.APP/CONTAINERAPPS and status=Failed" \
                --description "Failed Container Apps control-plane operations for softbakedev." \
                --output none
              az monitor activity-log alert action-group add \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$activity_alert_name" \
                --reset true \
                --action-group "$action_group_id" \
                --output none
            else
              az monitor activity-log alert create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$activity_alert_name" \
                --scope "$subscription_scope" \
                --condition "resourceType=MICROSOFT.APP/CONTAINERAPPS and resourceId=${app_resource_id} and status=Failed" \
                --description "Failed Container Apps control-plane operations for softbakedev." \
                --action-group "$action_group_id" \
                --output none
            fi
