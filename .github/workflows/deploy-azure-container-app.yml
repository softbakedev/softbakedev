name: Deploy Azure Container App

on:
  push:
    branches:
      - feature/new-design
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: azure-container-app-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout web app
        uses: actions/checkout@v4

      - name: Checkout recipes
        uses: actions/checkout@v4
        with:
          repository: softbakedev/recipes
          ref: main
          path: recipes

      - name: Compute image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          deploy_env="${{ inputs.environment || 'dev' }}"
          echo "IMAGE=ghcr.io/${owner}/softbakedev:${deploy_env}-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=ghcr.io/${owner}/softbakedev:${deploy_env}-latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-contexts: |
            recipes=./recipes
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_LATEST }}

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upsert Container Apps infrastructure and deploy
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAGE: ${{ env.IMAGE }}
          DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            if [ -z "$AZURE_RESOURCE_GROUP" ] || [ -z "$AZURE_LOCATION" ]; then
              echo "AZURE_RESOURCE_GROUP and AZURE_LOCATION secrets are required."
              exit 1
            fi

            az extension add --name containerapp --upgrade

            app_name="softbakedev-${DEPLOY_ENV}"
            env_name="softbakedev-${DEPLOY_ENV}-env"
            workspace_name="softbakedev-${DEPLOY_ENV}-law"

            workspace_id="$(az monitor log-analytics workspace show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --workspace-name "$workspace_name" \
              --query customerId \
              --output tsv 2>/dev/null || true)"

            if [ -z "$workspace_id" ]; then
              workspace_id="$(az monitor log-analytics workspace create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --workspace-name "$workspace_name" \
                --location "$AZURE_LOCATION" \
                --query customerId \
                --output tsv)"
            fi

            workspace_key="$(az monitor log-analytics workspace get-shared-keys \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --workspace-name "$workspace_name" \
              --query primarySharedKey \
              --output tsv)"

            if ! az containerapp env show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$env_name" >/dev/null 2>&1; then
              az containerapp env create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$env_name" \
                --location "$AZURE_LOCATION" \
                --logs-workspace-id "$workspace_id" \
                --logs-workspace-key "$workspace_key"
            fi

            if ! az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" >/dev/null 2>&1; then
              az containerapp create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --environment "$env_name" \
                --image "$IMAGE" \
                --ingress external \
                --target-port 8080 \
                --registry-server ghcr.io \
                --registry-username "$GHCR_USERNAME" \
                --registry-password "$GHCR_TOKEN" \
                --secrets "smtp-user=$SMTP_USER" "smtp-pass=$SMTP_PASS" \
                --env-vars \
                  PORT=8080 \
                  SMTP_HOST="$SMTP_HOST" \
                  SMTP_PORT="$SMTP_PORT" \
                  SMTP_USER=secretref:smtp-user \
                  SMTP_PASS=secretref:smtp-pass \
                  MAIL_FROM="$MAIL_FROM" \
                  MAIL_TO="$MAIL_TO"
            else
              az containerapp registry set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --server ghcr.io \
                --username "$GHCR_USERNAME" \
                --password "$GHCR_TOKEN"

              az containerapp secret set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --secrets "smtp-user=$SMTP_USER" "smtp-pass=$SMTP_PASS"

              az containerapp update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --image "$IMAGE" \
                --set-env-vars \
                  PORT=8080 \
                  SMTP_HOST="$SMTP_HOST" \
                  SMTP_PORT="$SMTP_PORT" \
                  SMTP_USER=secretref:smtp-user \
                  SMTP_PASS=secretref:smtp-pass \
                  MAIL_FROM="$MAIL_FROM" \
                  MAIL_TO="$MAIL_TO"
            fi

            az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query "properties.configuration.ingress.fqdn" \
              --output tsv
